[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bvdu-secquery"
version = "1.1.0"
description = "Offline-first, cross-platform file security scanner"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "BVDU Projects"}]
dependencies = ["cryptography>=42", "rich>=13", "truststore>=0.10"]
classifiers = ["Operating System :: OS Independent", "Programming Language :: Python :: 3"]

[project.optional-dependencies]
yara = ["yara-python>=4.5"]
dev = ["pytest>=8", "ruff>=0.6", "pip-audit>=2.8"]

[project.scripts]
secquery = "secquery.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
secquery = ["rules/*.yar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv", "build", "dist", "*.egg-info"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
